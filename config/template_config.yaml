# Sample sheet
deps:
  samples: config/snp_demux/samples.csv
  captures: config/snp_demux/captures.csv
  # NOTE: the cohort donor VCF is no longer consumed directly. Donor genotypes now
  # come per-capture from the sc_pileup per-pool informative panel at
  # <pileup_root>/panel/<capture>/informative.vcf.gz (built by sc_pileup with
  # panel.informative_filter: true, using the SAME sites the pileup ran against).
  # `vcf` is retained only for reference / non-panel runs; the vireo and
  # known_genotypes rules read the panel instead.
  vcf: data/snp/imputation/imputed_filtered.hg38.vcf.gz
  # Root of the sc_pileup engine pileups consumed by this stage:
  # <pileup_root>/<engine>/<platform>/<capture>/ .
  pileup_root: data/snp/pileup
  # Per-pool informative panels (donor genotypes), built by an upstream stage
  # (bcarc_chromium build_informative_panels): <panel_root>/<capture>/informative.vcf.gz.
  # Defaults to <pileup_root>/panel if omitted (standalone sc_pileup builds).
  panel_root: data/snp/vcf/panel
  # Platform used when a capture row has no `platform` column (sc_pileup keys by it).
  default_platform: short
  # Per-capture sex-call CSV (columns: barcode,sex_call,confidence with
  # sex_call in {female,male,no_signal}), produced upstream by cellranger predemux.
  # Python format-string keyed on {capture_id}; resolved by sex_path() in common.smk.
  # Consumed by the hierarchical consensus (sex-aware tie-breaking / QC). The join
  # is robust to this file being absent, so it is safe to leave pointing at a path
  # that may not exist yet.
  sex_calls: data/cellranger/count/predemux/{capture_id}/sex_calls.csv

outs:
  root: data/snp/demux/
  logs: logs/snp/demux
  # Optional. Where the HTML reports are written.
  # Defaults to <root>/report if omitted.
  reports: reports/snp_demux

params:
  # Which per-cell demux tools to run. The pipeline runs, aggregates and
  # consensuses ONLY the selected subset; `rule all` and the Demuxafy consensus
  # (Combine_Results.R) adapt automatically. Default = all four (fully backward
  # compatible). NOTE: demuxlet + freemuxlet require popscle pileups that are not
  # always available -- a run without them should list only e.g.
  # [souporcell, vireo], and Demuxafy will then combine just those two.
  # Demuxafy needs >=2 enabled tools to form a consensus.
  tools: [souporcell, vireo, demuxlet, freemuxlet]
  cellsnp_lite:
    minMAF: 0.1
    minCOUNT: 20
  demuxlet:
    coeff: 1.0
    offset: 0.05
  demuxafy:
    freemuxlet_correlation_limit: 0.7 # default
    souporcell_correlation_limit: 0.7 # default
    pct_agreement: 0.7 # default
  # souporcell clustering (remap+vartrix now done upstream by sc_pileup).
  souporcell:
    restarts: 100   # souporcell default
    min_ref: 10     # souporcell default
    min_alt: 10     # souporcell default
    ploidy: 2       # souporcell default
    # Run the second, genotype-anchored souporcell mode (souporcell/{c}/known/).
    # Whether it actually runs is decided by targets; this flag documents intent
    # and lets a downstream config disable the extra compute if desired.
    known_gt: true

  # Hierarchical, sex-aware consensus (runs ALONGSIDE demuxafy; see
  # docs/hierarchical_demux_design.md). De-novo souporcell decides cluster
  # membership (recovery); genotypes decide the donor label; sex breaks ties.
  hierarchical:
    margin_min: 0.15      # min vireosnp GPb_diff margin (best vs 2nd-best) to call a confident label
    sex_weight: 1.0       # weight of the sex prior when down-weighting sex-conflicting donors
    min_cells_floor: 20   # clusters below this cell count are flagged low_cell
    low_conf_keep: true   # keep de-novo-recovered cells even when the genotype label is weak

  # Donor present/absent screen (workflow/scripts/present_absent_screen.py).
  # Thresholds on the per-cell private-alt-site tail vs the ambient-only binomial
  # null (ambient estimated from cells NOT assigned to the donor).
  present_absent:
    min_covered_sites: 200    # fewer covered private sites than this -> "untestable"
    present_min_assigned: 15  # demux cells assigned to a donor at/above which it is present outright
    present_ge5_floor: 5      # cells with >=5 private-alt sites needed to call "present"
    present_tail_ratio: 2.0   # AND cells_ge3 must exceed this * null_exp_ge3
    absent_tail_ratio: 3.0    # "absent" needs cells_ge3 <= max(absent_ge3_abs, this*null)
    absent_ge3_abs: 3         # absolute floor on the >=3 tail tolerated for "absent"

ref:
  souporcell:
    genome_fasta: resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers: 
  demuxafy: resources/Demuxafy.sif
