# Sample sheet
deps:
  samples: config/snp_demux/samples.csv
  captures: config/snp_demux/captures.csv
  # NOTE: the cohort donor VCF is no longer consumed directly. Donor genotypes now
  # come per-capture from the sc_pileup per-pool informative panel at
  # <pileup_root>/panel/<capture>/informative.vcf.gz (built by sc_pileup with
  # panel.informative_filter: true, using the SAME sites the pileup ran against).
  # `vcf` is retained only for reference / non-panel runs; the vireo and
  # known_genotypes rules read the panel instead.
  vcf: data/snp/imputation/imputed_filtered.hg38.vcf.gz
  # Root of the sc_pileup engine pileups consumed by this stage:
  # <pileup_root>/<engine>/<platform>/<capture>/ .
  pileup_root: data/snp/pileup
  # Per-pool informative panels (donor genotypes), built by an upstream stage
  # (bcarc_chromium build_informative_panels): <panel_root>/<capture>/informative.vcf.gz.
  # Defaults to <pileup_root>/panel if omitted (standalone sc_pileup builds).
  panel_root: data/snp/vcf/panel
  # Panel VCF filename within <panel_root>/<capture>/ (index: <file>.csi).
  # Defaults to informative.vcf.gz; bcarc_chromium's unfiltered panels are panel.vcf.gz.
  panel_file: informative.vcf.gz
  # Platform used when a capture row has no `platform` column (sc_pileup keys by it).
  default_platform: short
  # Per-capture sex-call CSV (columns: barcode,sex_call,confidence with
  # sex_call in {female,male,no_signal}), produced upstream by cellranger predemux.
  # Python format-string keyed on {capture_id}; resolved by sex_path() in common.smk.
  # Consumed by the hierarchical consensus (sex-aware tie-breaking / QC). The join
  # is robust to this file being absent, so it is safe to leave pointing at a path
  # that may not exist yet.
  sex_calls: data/cellranger/count/predemux/{capture_id}/sex_calls.csv

outs:
  root: data/snp/demux/
  logs: logs/snp/demux
  # Optional. Where the HTML reports are written.
  # Defaults to <root>/report if omitted.
  reports: reports/snp_demux

params:
  # Which per-cell demux tools to run. The pipeline runs, aggregates and
  # consensuses ONLY the selected subset; `rule all` and the Demuxafy consensus
  # (Combine_Results.R) adapt automatically. Default = all four (fully backward
  # compatible). NOTE: demuxlet + freemuxlet require popscle pileups that are not
  # always available -- a run without them should list only e.g.
  # [souporcell, vireo], and Demuxafy will then combine just those two.
  # Demuxafy needs >=2 enabled tools to form a consensus.
  tools: [souporcell, vireo, demuxlet, freemuxlet]
  cellsnp_lite:
    minMAF: 0.1
    minCOUNT: 20
  demuxlet:
    coeff: 1.0
    offset: 0.05
  demuxafy:
    freemuxlet_correlation_limit: 0.7 # default
    souporcell_correlation_limit: 0.7 # default
    pct_agreement: 0.7 # default
  # souporcell clustering (remap+vartrix now done upstream by sc_pileup).
  souporcell:
    # restarts, seed and denovo_threads are read by the second, de novo run
    # (souporcell/{c}/known/); its result depends on all three. The first run
    # passes --known_genotypes and runs one solve (see souporcell.smk).
    restarts: 100   # souporcell default
    min_ref: 10     # souporcell default
    min_alt: 10     # souporcell default
    ploidy: 2       # souporcell default
    seed: 4         # souporcell default; 0-255
    denovo_threads: 10  # 100 restarts = 10 per thread
    # Read by no rule: the second run (souporcell/{c}/known/) always runs,
    # because hierarchical_consensus and aggregate_souporcell require its
    # clusters.tsv. Kept as a record of intent.
    known_gt: true
  # vireo. Optional: omitted keys take these defaults.
  vireo:
    # --callAmbientRNAs: per-cell ambient shares (vireo/<capture>/prop_ambient.tsv,
    # read by mkobj). Most of vireo's CPU; no call depends on it. false (runs that
    # need only calls) writes prop_ambient.tsv with NA for every cell.
    call_ambient: true
    # --randSeed (0 to 2**32 - 1); null passes none. Fixed-mode calls never depend
    # on it. With one worker it makes prop_ambient.tsv repeat; above one worker it
    # does not. For one worker, pass a copy of profiles/workflow whose vireo entry
    # sets threads: 1 as --workflow-profile (not --set-resources on the command line).
    seed: null

  # Hierarchical, sex-aware consensus (runs ALONGSIDE demuxafy; see
  # docs/hierarchical_demux_design.md). De-novo souporcell decides cluster
  # membership (recovery); genotypes decide the donor label; sex breaks ties.
  hierarchical:
    margin_min: 0.15      # min vireosnp GPb_diff margin (best vs 2nd-best) to call a confident label
    sex_weight: 1.0       # weight of the sex prior when down-weighting sex-conflicting donors
    min_cells_floor: 20   # clusters below this cell count are flagged low_cell
    low_conf_keep: true   # keep de-novo-recovered cells even when the genotype label is weak

  # Pre-flight donor present/absent screen (workflow/scripts/present_absent_screen.py).
  # Coarse QC gate: per donor, count cells carrying >= k_sites of that donor's private
  # alleles; call present when >= min_cells such cells exist. A flag only -- nothing
  # downstream prunes the panel or sets souporcell k from it.
  present_absent:
    min_covered_sites: 200  # fewer covered private sites than this -> "untestable"
    k_sites: 3              # a cell needs >= this many private-alt sites to count as evidence
    min_cells: 3            # >= this many evidence cells -> "present" (else "absent")

  # Expected doublet rate per 1,000 cells recovered (here, barcodes
  # demultiplexed), by chip, from 10x's multiplet-rate table. Used for
  # doublet_rate_loading / doublet_rate_vs_loading in doublet_summary.csv. A
  # capture picks its chip from an optional `chip` column in captures.csv;
  # blank -> default_chip.
  doublet:
    rate_per_1k:
      standard: 0.008
      HT: 0.004
    default_chip: standard

ref:
  souporcell:
    genome_fasta: resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers:
  # Focused per-tool images replace the monolithic Demuxafy.sif. demuxafy is a
  # slimmed image carrying only the Demuxafy consensus + summary scripts; the
  # workflow's own R scripts/reports run in a plain R image.
  bcftools: docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  # vireo (demux CLI) pinned to Demuxafy.sif's exact vireoSNP 0.5.7 env.
  vireo: docker://ghcr.io/swarbricklab/snp_demux-vireo:0.5.7
  # souporcell-genotyping (annotate.py) + the vireoSNP cell-count script keep the
  # original 0.5.6 image (their pre-split baseline; count uses only pandas/numpy).
  vireosnp: docker://swarbricklab/vireo_snp:0.5.6
  souporcell: docker://cumulusprod/souporcell:2.5
  # popscle (demuxlet + freemuxlet clustering), built from the da70fc78 commit
  # Demuxafy.sif shipped; shared with sc_pileup's dsc-pileup image.
  popscle: docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  r: docker://ghcr.io/swarbricklab/snp_demux-r:r4.2
  # demuxafy = R + the Demuxafy consensus/summary/assign scripts (Combine_Results.R,
  # Assign_Indiv_by_Geno.R, *_summary.sh) pinned to the sif's script commit.
  demuxafy: docker://ghcr.io/swarbricklab/snp_demux-demuxafy:63fb228
