# Sample sheet
deps:
  samples: config/snp_demux/samples.csv
  captures: config/snp_demux/captures.csv
  # NOTE: the cohort donor VCF is no longer consumed directly. Donor genotypes now
  # come per-capture from the sc_pileup per-pool informative panel at
  # <pileup_root>/panel/<capture>/informative.vcf.gz (built by sc_pileup with
  # panel.informative_filter: true, using the SAME sites the pileup ran against).
  # `vcf` is retained only for reference / non-panel runs; the vireo and
  # known_genotypes rules read the panel instead.
  vcf: data/snp/imputation/imputed_filtered.hg38.vcf.gz
  # Root of the sc_pileup engine pileups consumed by this stage:
  # <pileup_root>/<engine>/<platform>/<capture>/ .
  pileup_root: data/snp/pileup
  # Per-pool informative panels (donor genotypes), built by an upstream stage
  # (bcarc_chromium build_informative_panels): <panel_root>/<capture>/informative.vcf.gz.
  # Defaults to <pileup_root>/panel if omitted (standalone sc_pileup builds).
  panel_root: data/snp/vcf/panel
  # Platform used when a capture row has no `platform` column (sc_pileup keys by it).
  default_platform: short

outs:
  root: data/snp/demux/
  logs: logs/snp/demux
  # Optional. Where the HTML reports are written.
  # Defaults to <root>/report if omitted.
  reports: reports/snp_demux

params:
  cellsnp_lite:
    minMAF: 0.1
    minCOUNT: 20
  demuxlet:
    coeff: 1.0
    offset: 0.05
  demuxafy:
    freemuxlet_correlation_limit: 0.7 # default
    souporcell_correlation_limit: 0.7 # default
    pct_agreement: 0.7 # default
  # souporcell clustering (remap+vartrix now done upstream by sc_pileup).
  souporcell:
    restarts: 100   # souporcell default
    min_ref: 10     # souporcell default
    min_alt: 10     # souporcell default
    ploidy: 2       # souporcell default

ref:
  souporcell:
    genome_fasta: resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers:
  # Focused per-tool images replace the monolithic Demuxafy.sif. demuxafy is a
  # slimmed image carrying only the Demuxafy consensus + summary scripts; the
  # workflow's own R scripts/reports run in a plain R image.
  bcftools: docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  # vireo (demux CLI) pinned to Demuxafy.sif's exact vireoSNP 0.5.7 env.
  vireo: docker://ghcr.io/swarbricklab/snp_demux-vireo:0.5.7
  # souporcell-genotyping (annotate.py) + the vireoSNP cell-count script keep the
  # original 0.5.6 image (their pre-split baseline; count uses only pandas/numpy).
  vireosnp: docker://swarbricklab/vireo_snp:0.5.6
  souporcell: docker://cumulusprod/souporcell:2.5
  # popscle (demuxlet + freemuxlet clustering), built from the da70fc78 commit
  # Demuxafy.sif shipped; shared with sc_pileup's dsc-pileup image.
  popscle: docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  r: docker://ghcr.io/swarbricklab/snp_demux-r:r4.2
  # demuxafy = R + the Demuxafy consensus/summary/assign scripts (Combine_Results.R,
  # Assign_Indiv_by_Geno.R, *_summary.sh) pinned to the sif's script commit.
  demuxafy: docker://ghcr.io/swarbricklab/snp_demux-demuxafy:63fb228
