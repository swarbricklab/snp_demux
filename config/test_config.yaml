# Sample sheet
deps:
  samples: config/samples.csv
  captures: config/captures.csv
  vcf: test/data/imputation/imputed_filtered.hg38.vcf.gz
  pileup_root: test/data/pileup
  default_platform: short
  # Optional per-capture sex-call CSV (format-string keyed on {capture_id}).
  sex_calls: test/data/predemux/{capture_id}/sex_calls.csv

outs:
  root: test/results
  logs: test/logs

params:
  cellsnp_lite:
    minMAF: 0.1
    minCOUNT: 20
  demuxlet:
    coeff: 1.0
    offset: 0.05
  demuxafy:
    freemuxlet_correlation_limit: 0.7 # default
    souporcell_correlation_limit: 0.7 # default
    pct_agreement: 0.7 # default
  souporcell:
    restarts: 100
    min_ref: 10
    min_alt: 10
    ploidy: 2
    known_gt: true
  hierarchical:
    margin_min: 0.15
    sex_weight: 1.0
    min_cells_floor: 20
    low_conf_keep: true

ref:
  souporcell:
    genome_fasta: resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers: 
  demuxafy: resources/Demuxafy.sif
