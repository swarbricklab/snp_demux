# Sample sheet
deps:
  samples: config/samples.csv
  captures: config/captures.csv
  vcf: .tests/integration/data/imputation/imputed_filtered.hg38.vcf.gz
  pileup_root: .tests/integration/data/pileup
  default_platform: short

outs:
  root: .tests/integration/results
  logs: .tests/integration/logs

params:
  cellsnp_lite:
    minMAF: 0.1
    minCOUNT: 20
  demuxlet:
    coeff: 1.0
    offset: 0.05
  demuxafy:
    freemuxlet_correlation_limit: 0.5 # relaxed for the shallow test fixture (prod: 0.7)
    souporcell_correlation_limit: 0.5 # relaxed for the shallow test fixture (prod: 0.7)
    pct_agreement: 0.5 # relaxed for the shallow test fixture (prod: 0.7)
  souporcell:
    restarts: 100
    min_ref: 2
    min_alt: 2
    ploidy: 2

ref:
  souporcell:
    genome_fasta: resources/genomes/refdata-gex-GRCh38-2020-A/fasta/genome.fa

containers:
  bcftools: docker://quay.io/biocontainers/bcftools:1.13--h3a49de5_0
  vireo: docker://ghcr.io/swarbricklab/snp_demux-vireo:0.5.7
  vireosnp: docker://swarbricklab/vireo_snp:0.5.6
  souporcell: docker://cumulusprod/souporcell:2.5
  popscle: docker://ghcr.io/swarbricklab/sc_pileup-popscle:da70fc78
  r: docker://ghcr.io/swarbricklab/snp_demux-r:r4.2
  demuxafy: docker://ghcr.io/swarbricklab/snp_demux-demuxafy:63fb228
