# NOTE: needs snakemake >= 7.28.3 to use this by default via --workflow-profile flag
#       For versions lower than this (e.g., dvc_stable is currently lower than this) use --profile workflow/profiles/default

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 3
# Conda settings
use-conda: True
conda-frontend: mamba
conda-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
# Singularity settings
use-singularity: True
singularity-prefix: /directflow/TumourProgressionGroupTemp/projects/snakecache/
singularity-args: "--bind /scratch_local,/share/ScratchGeneral,/directflow/TumourProgressionGroupTemp/projects"
# Job settings
jobs: 100
jobname: "{name}.{jobid}.sh"
# Default resource settings
default-resources:
  - threads="1"
  - mem_per_core="16G"
  - disk_per_core="10G"
# DRMAA settings
drmaa: "-P TumourProgression -cwd -S /bin/bash -V -b y -j y -pe smp {resources.threads} -l h_vmem={resources.mem_per_core},mem_requested={resources.mem_per_core},tmp_requested={resources.disk_per_core},tmpfree={resources.disk_per_core}"
drmaa-log-dir: logs/drmaa
# Resources for individual rules
