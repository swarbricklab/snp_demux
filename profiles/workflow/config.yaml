# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 0

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule
set-resources:
  dsc_pileup_demuxlet_by_chromosome:
    threads: 1
    mem: "12GB"
  dsc_pileup_freemuxlet_by_chromosome:
    threads: 1
    mem: "12GB"
  cellsnp-lite:
    threads: 16
    mem: "16GB"
  merge_pileup:
    threads: 1
    mem: "96GB"
  merge_pileup_freemuxlet:
    threads: 1
    mem: "96GB"
  demuxafy:
    mem: "2GB"
    runtime: 60
  demuxlet:
    mem: "16GB"
    runtime: 60
  demuxlet_summary:
    mem: "8GB"
    runtime: 5
  dsc_pileup_demuxlet:
    mem: "640GB"
    runtime: 1440
  dsc_pileup_freemuxlet:
    mem: "640GB"
    runtime: 1400
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 60
  freemuxlet_genotyping:
    mem: "20GB"
  freemuxlet_summary:
    mem: "2GB"
    runtime: 5
  split_by_chr:
    mem: "2GB"
    runtime: 5
  souporcell:
    threads: 16
    mem: "512GB"
    runtime: 1440
  souporcell_genotyping:
    mem: "20GB"
  vireo:
    threads: 16
    mem: "128GB"
  vireosnp:
    mem: "8GB"
    runtime: 10

