# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# No job grouping. Rule-level `group:` directives were removed in a2a973f: a
# grouped submission ran at default-resources (set-resources did not apply to
# it) and serialized each capture behind souporcell. Each rule is its own job.

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule
#
# Values below were refined against ACTUAL PBS "Resource Usage" blocks from the
# cohort run (logs/joblogs/<rule>/*.log). Sizing = ~1.3x observed max Memory Used
# (rounded to a sensible value, floor ~2GB) and ~1.5x max Walltime Used (floor 30
# min). See the review notes in the report for per-rule provenance. NOTE: some
# joblogs used for sizing predate the removal of job grouping (a2a973f) -- while
# grouped, the diagnostic rules ran at the 4GB DEFAULT (set-resources didn't apply
# to grouped submissions), which is why report_variant_embedding OOM-killed ~18x.
# Grouping is now removed, so these set-resources DO apply going forward.
set-resources:
  # --- demuxlet family ---
  demuxlet:
    threads: 1
    mem: "10GB"
    runtime: 30
  demuxlet_summary:
    threads: 1
    mem: "2GB"
    runtime: 30
  # --- demuxafy wrapper ---
  demuxafy:
    mem: "2GB"
    runtime: 30
  # --- freemuxlet family ---
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 45
  freemuxlet_summary:
    mem: "2GB"
    runtime: 30
  # --- souporcell ---
  # One genotype-started solve on one thread (--restarts 1 --threads 1 in the
  # rule): median 12 s, max 92 s, peak 0.8 GB over 121 captures on harmonized
  # panels (up to 36,759 cells); max 83 s, 1.1 GB over 17 more. 4 GB is what
  # one CPU carries at no extra charge. Walltime is charged as used; 480 min
  # covers one solve on the 30-40k-cell pools of the earlier union panels, where
  # 100 restarts (7 solves per thread) ran past 12 h.
  souporcell_cluster:
    threads: 1
    mem: "4GB"
    runtime: 480
  souporcell_troublet:
    threads: 1
    mem: "6GB"
    runtime: 30
  souporcell_consensus:
    # consensus.py runs a pystan mixture model and historically OOM-killed at 8GB.
    # Real peak ~11GB this cohort. Memory grows with the attempt in the rule
    # (8, 16, 32GB); no mem here (set-resources would override it).
    threads: 1
    runtime: 30
  # Second run (souporcell/{c}/known/): same footprint as the first run's trio.
  souporcell_cluster_known:
    # Same one solve. Its start sits on other sites' genotypes, so the fit takes
    # ~2.5x the first run's time (17 captures at 100 restarts).
    threads: 1
    mem: "4GB"
    runtime: 480
  souporcell_troublet_known:
    threads: 1
    mem: "4GB"
    runtime: 30
  souporcell_consensus_known:
    # No direct data this cohort; mirrors souporcell_consensus (memory in the
    # rule; no mem here).
    threads: 1
    runtime: 30
  # --- vireo ---
  # Real peak only ~10GB; profile was 32GB. (Some vireo jobs were also seen running
  # at 125GB via a rule-level mem override -- flagged for follow-up.)
  vireo:
    # 16 workers and 30 min, kept for speed. Fixed-mode vireo assigns cells on
    # one thread; --callAmbientRNAs fits each cell's ambient share in a pool of
    # --nproc workers (resources.threads) and is 85-99% of the CPU.
    # donor_ids.tsv is identical at 1, 4, 8 and 16 workers.
    # A cheaper, slower setting was measured and can be swapped in when SU is
    # tight: `threads: 4` with `runtime: 240` and the same 16 GB, which 4 CPUs
    # carry at no extra charge. Over 9 captures it wrote identical call tables
    # and kept 64-96% of its CPUs busy (16 workers: 28-84%). It ran 1.8-3.1x
    # longer, at most 44 min against 16, for about a third less charge (11.0
    # against 16.7 SU on six of the captures). 8 workers was timed on one small
    # capture only: 140 s, against 109 s at 16 and 183 s at 4. PBS memory used
    # (page cache included) reached 15.6 GB at 4 and at 16 workers on an
    # 18,930-cell capture.
    threads: 16  # cheaper and slower: 4, with runtime 240 (see above)
    mem: "16GB"
    runtime: 30
  vireosnp:
    # Real peak ~6.6GB -> 10GB (nudged up from 8GB for 1.3x headroom).
    mem: "10GB"
    runtime: 30
  # --- Python diagnostics / pre-flight screen ---
  # (Historically ran at the 4GB DEFAULT while grouped -- grouping is now removed
  # so these apply.) report_variant_embedding (UMAP) OOM-killed ~18x at 4GB; PBS
  # has since recorded at most 4.0GB over 17 captures. Its memory grows with the
  # attempt in the rule (8, 16, 32GB; the last equals the old 32GB); no mem here
  # (set-resources would override it). The others fit comfortably in 4GB
  # (observed peaks noted).
  report_variant_embedding:
    threads: 1
  present_absent_screen:
    # Observed peak ~2.5GB across 144 jobs.
    threads: 1
    mem: "4GB"
    runtime: 30
  report_distinctiveness:
    # Observed peak ~2.6GB across 144 jobs.
    threads: 1
    mem: "4GB"
    runtime: 30
  hierarchical_consensus:
    # Observed peak ~0.7GB across 116 jobs.
    threads: 1
    mem: "2GB"
    runtime: 30
