# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# Job grouping: pack each capture's lightweight post-processing chain into ONE
# PBS submission (per-capture; group-components postproc=1) instead of ~12 tiny
# jobs, to cut scheduler churn and queue waits. Heavy/parallel rules
# (souporcell*, vireo) are deliberately left OUT so they still spread across
# nodes. Group resources are derived from members + default-resources; every
# member here is small (<=8GB, minutes), so a per-capture group fits one node.
groups:
  known_genotypes: postproc
  extract_genotyped_donors: postproc
  subset_vcf: postproc
  relabel_vireo: postproc
  reheader_vireo_vcf: postproc
  summarise_ambient: postproc
  vireosnp: postproc
  join_sex: postproc
  hierarchical_consensus: postproc
  report_distinctiveness: postproc
  report_variant_embedding: postproc
  leave_one_out: postproc
  demuxafy: postproc
  add_vireosnp_to_combined_results: postproc
  wrangle_demuxafy_assignments: postproc
  wrangle_stats: postproc
  report_capture: postproc
  report_capture_metrics: postproc

group-components:
  postproc: 1

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule
set-resources:
  dsc_pileup_demuxlet_by_chromosome:
    threads: 1
    mem: "64GB"
  dsc_pileup_freemuxlet_by_chromosome:
    threads: 1
    mem: "64GB"
  cellsnp-lite:
    threads: 32
    mem: "32GB"
    runtime: 1440
  merge_cel_demuxlet:
    threads: 1
    mem: 4GB
  merge_var_demuxlet:
    threads: 1
    mem: 4GB
  merge_plp_demuxlet:
    threads: 1
    mem: 4GB
  merge_umi_demuxlet:
    threads: 1
    mem: 4GB
  wrangle_umi_demuxlet:
    threads: 1
    mem: 4GB
  merge_cel_demuxlet:
    threads: 1
    mem: 4GB
  merge_var_demuxlet:
    threads: 1
    mem: 4GB
  merge_plp_demuxlet:
    threads: 1
    mem: 4GB
  merge_umi_demuxlet:
    threads: 1
    mem: 4GB
  wrangle_umi_demuxlet:
    threads: 1
    mem: 4GB
  demuxafy:
    mem: "2GB"
    runtime: 60
  demuxlet:
    mem: "16GB"
    runtime: 60
  demuxlet_summary:
    mem: "8GB"
    runtime: 5
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 60
  freemuxlet_genotyping:
    mem: "20GB"
  freemuxlet_summary:
    mem: "2GB"
    runtime: 5
  split_by_chr:
    mem: "2GB"
    runtime: 5
  souporcell:
    threads: 32
    mem: "190GB"
    runtime: 1440
  # sc_pileup branch: souporcell is split into cluster/troublet/consensus, resuming
  # from the sc_pileup ref/alt.mtx (remap+vartrix already done upstream). Cluster is
  # the heavy step; troublet/consensus are light.
  souporcell_cluster:
    threads: 16
    mem: "64GB"
    runtime: 720
  souporcell_troublet:
    threads: 1
    mem: "8GB"
  souporcell_consensus:
    threads: 1
    mem: "8GB"
  souporcell_genotyping:
    mem: "20GB"
  vireo:
    threads: 16
    mem: "32GB"
  vireosnp:
    mem: "8GB"
    runtime: 10

