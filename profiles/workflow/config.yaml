# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# No job grouping. Rule-level `group:` directives were removed in a2a973f: a
# grouped submission ran at default-resources (set-resources did not apply to
# it) and serialized each capture behind souporcell. Each rule is its own job.

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule
#
# Values below were refined against ACTUAL PBS "Resource Usage" blocks from the
# cohort run (logs/joblogs/<rule>/*.log). Sizing = ~1.3x observed max Memory Used
# (rounded to a sensible value, floor ~2GB) and ~1.5x max Walltime Used (floor 30
# min). See the review notes in the report for per-rule provenance. NOTE: some
# joblogs used for sizing predate the removal of job grouping (a2a973f) -- while
# grouped, the diagnostic rules ran at the 4GB DEFAULT (set-resources didn't apply
# to grouped submissions), which is why report_variant_embedding OOM-killed ~18x.
# Grouping is now removed, so these set-resources DO apply going forward.
set-resources:
  # --- demuxlet family ---
  demuxlet:
    threads: 1
    mem: "10GB"
    runtime: 30
  demuxlet_summary:
    threads: 1
    mem: "2GB"
    runtime: 30
  # --- demuxafy wrapper ---
  demuxafy:
    mem: "2GB"
    runtime: 30
  # --- freemuxlet family ---
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 45
  freemuxlet_summary:
    mem: "2GB"
    runtime: 30
  # --- souporcell ---
  # sc_pileup branch: "cluster" is the heavy step but it is CPU-bound, not
  # memory-bound -- real peak only ~3GB. Was 64GB.
  souporcell_cluster:
    # CPU-bound (peak ~3GB), but --restarts 100 on the 30-40k-cell pools exceeds
    # 12h -> 24h walltime (NeoMet_Pool_009_2 / Atlas_Pool_7b class).
    threads: 16
    mem: "8GB"
    runtime: 1440
  souporcell_troublet:
    threads: 1
    mem: "6GB"
    runtime: 30
  souporcell_consensus:
    # consensus.py runs a pystan mixture model and historically OOM-killed at 8GB.
    # Real peak ~11GB this cohort -> 16GB (comfortably above the 8GB that failed).
    threads: 1
    mem: "16GB"
    runtime: 30
  # Genotype-anchored second pass mirrors the de-novo trio's (now smaller) footprint.
  souporcell_cluster_known:
    # Same as the de-novo cluster: --restarts 100 on big pools needs 24h
    # (job 963 / NeoMet_Pool_009_2 hit the old 12h limit at only 2.6GB used).
    threads: 16
    mem: "8GB"
    runtime: 1440
  souporcell_troublet_known:
    threads: 1
    mem: "4GB"
    runtime: 30
  souporcell_consensus_known:
    # No direct data this cohort; mirrors souporcell_consensus.
    threads: 1
    mem: "16GB"
    runtime: 30
  # --- vireo ---
  # Real peak only ~10GB; profile was 32GB. (Some vireo jobs were also seen running
  # at 125GB via a rule-level mem override -- flagged for follow-up.)
  vireo:
    threads: 16
    mem: "16GB"
    runtime: 30
  vireosnp:
    # Real peak ~6.6GB -> 10GB (nudged up from 8GB for 1.3x headroom).
    mem: "10GB"
    runtime: 30
  # --- Python diagnostics / pre-flight screen ---
  # (Historically ran at the 4GB DEFAULT while grouped -- grouping is now removed
  # so these apply.) report_variant_embedding (UMAP) OOM-killed ~18x at 4GB, so its
  # 32GB is KEPT (never below what OOM'd; true peak still unverified as it was killed
  # before reaching it). The others fit comfortably in 4GB (observed peaks noted).
  report_variant_embedding:
    threads: 1
    mem: "32GB"
  present_absent_screen:
    # Observed peak ~2.5GB across 144 jobs.
    threads: 1
    mem: "4GB"
    runtime: 30
  report_distinctiveness:
    # Observed peak ~2.6GB across 144 jobs.
    threads: 1
    mem: "4GB"
    runtime: 30
  hierarchical_consensus:
    # Observed peak ~0.7GB across 116 jobs.
    threads: 1
    mem: "2GB"
    runtime: 30
