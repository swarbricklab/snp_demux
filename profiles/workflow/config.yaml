# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# Job grouping: each capture's lightweight post-processing chain is packed into
# ONE PBS submission (per-capture) via rule-level `group: "postproc"` directives
# in workflow/rules/*.smk, instead of ~12 tiny jobs, to cut scheduler churn and
# queue waits. The directives live in the rules (not here) because snakemake 7.32
# does not reliably honor `groups:`/`group-components:` from a --workflow-profile.
# Heavy/parallel rules (souporcell*, vireo) and the pre-flight screen are left
# ungrouped so they still spread across nodes / run early. Snakemake's default of
# one job per connected group component already yields per-capture grouping.

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule
set-resources:
  dsc_pileup_demuxlet_by_chromosome:
    threads: 1
    mem: "64GB"
  dsc_pileup_freemuxlet_by_chromosome:
    threads: 1
    mem: "64GB"
  cellsnp-lite:
    threads: 32
    mem: "32GB"
    runtime: 1440
  merge_cel_demuxlet:
    threads: 1
    mem: 4GB
  merge_var_demuxlet:
    threads: 1
    mem: 4GB
  merge_plp_demuxlet:
    threads: 1
    mem: 4GB
  merge_umi_demuxlet:
    threads: 1
    mem: 4GB
  wrangle_umi_demuxlet:
    threads: 1
    mem: 4GB
  merge_cel_demuxlet:
    threads: 1
    mem: 4GB
  merge_var_demuxlet:
    threads: 1
    mem: 4GB
  merge_plp_demuxlet:
    threads: 1
    mem: 4GB
  merge_umi_demuxlet:
    threads: 1
    mem: 4GB
  wrangle_umi_demuxlet:
    threads: 1
    mem: 4GB
  demuxafy:
    mem: "2GB"
    runtime: 60
  demuxlet:
    mem: "16GB"
    runtime: 60
  demuxlet_summary:
    mem: "8GB"
    runtime: 5
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 60
  freemuxlet_genotyping:
    mem: "20GB"
  freemuxlet_summary:
    mem: "2GB"
    runtime: 5
  split_by_chr:
    mem: "2GB"
    runtime: 5
  souporcell:
    threads: 32
    mem: "190GB"
    runtime: 1440
  # sc_pileup branch: souporcell is split into cluster/troublet/consensus, resuming
  # from the sc_pileup ref/alt.mtx (remap+vartrix already done upstream). Cluster is
  # the heavy step; troublet/consensus are light.
  souporcell_cluster:
    threads: 16
    mem: "64GB"
    runtime: 720
  souporcell_troublet:
    threads: 1
    mem: "16GB"
  souporcell_consensus:
    # consensus.py loads the alt/ref matrices and runs a pystan mixture model; it
    # is NOT light -- it OOM-killed at 8GB on the ~40k-cell pools (Atlas_Pool_7b).
    threads: 1
    mem: "48GB"
  # The genotype-anchored second souporcell pass mirrors the de-novo trio and needs
  # matching resources -- without these it falls back to the 4GB default and OOMs
  # cluster/consensus on large pools.
  souporcell_cluster_known:
    threads: 16
    mem: "64GB"
    runtime: 720
  souporcell_troublet_known:
    threads: 1
    mem: "16GB"
  souporcell_consensus_known:
    threads: 1
    mem: "48GB"
  souporcell_genotyping:
    mem: "20GB"
  vireo:
    threads: 16
    mem: "32GB"
  vireosnp:
    mem: "8GB"
    runtime: 10
  # Python diagnostics / pre-flight screen load the cellSNP AD/DP matrices; the
  # largest captures (~30-40k cells) OOM at the 4GB default -- report_variant_embedding
  # (UMAP) was SIGKILLed on the 30k-cell Atlas_Pool_13a. Sized for the biggest pools.
  report_variant_embedding:
    threads: 1
    mem: "32GB"
  present_absent_screen:
    threads: 1
    mem: "16GB"
  report_distinctiveness:
    threads: 1
    mem: "12GB"
  hierarchical_consensus:
    threads: 1
    mem: "8GB"

