# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule. Only rules that need more than the defaults are
# listed; everything else (bcftools helpers, R wrangling/reporting, summaries,
# aggregation, preflight) runs with Snakemake's defaults.
#
# Where both histories set a rule, the merge keeps the LARGER of each value:
# main's release sizing, or the sizing refined against PBS "Resource Usage"
# from a 138-capture cohort run (~1.3x observed max memory, ~1.5x max walltime).
#
# Queue: the rules below that carry queue: normalsr run on that queue. It
# charges the same 2 SU per CPU-hour as normal, and one CPU carries 4.8 GB
# there at no extra charge (4 GB on normal). Single test runs of other steps
# used 19-44% fewer CPU-seconds on normalsr. On one 14,299-cell capture, with
# vireo on 16 workers, the 12 of these rules that rule all runs used 0.69 of
# the CPU-seconds and 0.67 of the SU they used on normal, with identical
# must-match outputs; queue wait was about 1.5 min on normalsr and 1.1 min on
# normal over 26 jobs. pbs_submit.py passes
# resources.queue to qsub -q. It is set per rule because a default-resources
# block here would replace the global profile's whole default-resources list.
set-resources:
  # --- demuxlet / freemuxlet ---
  demuxlet:
    threads: 1
    mem: "16GB"
    runtime: 60
  demuxlet_summary:
    mem: "8GB"
    runtime: 30
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 60
  freemuxlet_summary:
    mem: "2GB"
    runtime: 30
  demuxafy:
    mem: "2GB"
    runtime: 60
  # --- souporcell: resumes from sc_pileup's ref/alt.mtx ---
  # One genotype-started solve on one thread (--restarts 1 --threads 1 in the
  # rule): median 12 s, max 92 s, peak 0.8 GB over 121 captures on harmonized
  # panels (up to 36,759 cells); max 83 s, 1.1 GB over 17 more. 4 GB is what
  # one CPU carries at no extra charge. Walltime is charged as used; 480 min
  # covers one solve on the 30-40k-cell pools of the earlier union panels, where
  # 100 restarts (7 solves per thread) ran past 12 h.
  # What drives the cost: a solve's CPU time and resident memory grow in step
  # with the matrix entries (cell-site pairs with reads). Over 138 captures one
  # solve took a median 2.4 s of CPU (0.7-8.9 s) and 0.05 GB per million entries.
  souporcell_cluster:
    threads: 1
    mem: "4GB"
    runtime: 480
    queue: normalsr
  souporcell_troublet:
    threads: 1
    mem: "8GB"
    runtime: 30
    queue: normalsr
  souporcell_consensus:
    # consensus.py runs a pystan mixture model; OOM-killed at 8GB, cohort peak ~11GB.
    # Memory grows with the attempt in the rule (8, 16, 32GB); no mem here
    # (set-resources would override it).
    # What drives the cost: about 1 min per job that does not grow with the capture
    # (likely the Stan compile, run in every job), plus 1-2 s per 1,000 matrix rows.
    # PBS memory used was 2.4-3.9 GB up to 14 million entries, 4.6-7.1 GB above.
    threads: 1
    runtime: 30
    queue: normalsr
  # Second run (souporcell/{c}/known/).
  souporcell_cluster_known:
    # De novo: params.souporcell.restarts on denovo_threads threads (100 on 10 by
    # default). The CPU request follows the rule (resources: threads), so there
    # is no threads key here. Peak ~3GB at 16 threads; 100 restarts on the
    # 30-40k-cell pools of the earlier union panels ran past 12h.
    # What drives the cost: CPU is restarts times one solve, which grows with the
    # matrix entries (a restart took 0.5-1.0x a genotype-started solve, 3 captures).
    # Walltime is ceil(restarts / threads) solves, with 69-81% of 10 CPUs busy.
    mem: "8GB"
    runtime: 1440
    queue: normalsr
  souporcell_troublet_known:
    threads: 1
    mem: "4GB"
    runtime: 30
    queue: normalsr
  souporcell_consensus_known:
    # Memory grows with the attempt in the rule, as for souporcell_consensus;
    # no mem here. It runs the same script on the same matrices, so its cost
    # should follow the same drivers; rule all does not request it, so it was
    # not measured.
    threads: 1
    runtime: 30
    queue: normalsr
  # --- vireo ---
  subset_vcf:
    # bcftools subset of the pool's panel; default resources otherwise.
    queue: normalsr
  vireo:
    # 16 workers, 32 GB and 30 min, kept for speed. Fixed-mode vireo assigns cells
    # on one thread; --callAmbientRNAs fits each cell's ambient share in a pool of
    # --nproc workers (resources.threads) and is 85-99% of the CPU.
    # Two cheaper, slower settings were timed with 16 GB on 9 captures, for when
    # SU is tight. Both wrote call tables identical to 16 workers. Over the 9:
    #   threads: 8, runtime: 120               1.64x the walltime, 0.82 of the SU
    #   threads: 4, runtime: 240, mem: "16GB"  2.67x the walltime, 0.67 of the SU
    # The longest job took 16 min at 16, 29 min at 8 and 44 min at 4. Per
    # 138-capture pass on normal that is about 154 and 123 SU against 184. 8 CPUs
    # carry 32 GB at no extra charge; 32 GB on 4 CPUs is charged as 8 on normal.
    # What drives the cost: CPU grows faster than the number of cells, and more
    # per cell on larger panels. About half the walltime at 16 workers does not
    # shrink with more workers, yet each CPU is charged for all of it. PBS memory
    # used (page cache included) reached the full 16 GB at 4, 8 and 16 workers
    # on an 18,930-cell capture with 1.5 million sites in the donor file.
    threads: 16  # cheaper and slower: 8 or 4 workers (see above)
    mem: "32GB"
    runtime: 30
    queue: normalsr
  vireosnp:
    mem: "10GB"
    runtime: 30
    queue: normalsr
  # --- Python diagnostics / pre-flight screen ---
  # report_variant_embedding (UMAP) OOM-killed at 4GB; PBS has since recorded at
  # most 4.0GB over 17 captures. Its memory grows with the attempt in the rule
  # (8, 16, 32GB; the last equals the old 32GB); no mem here (set-resources would
  # override it).
  # What drives the cost: PBS memory used grows with cells, about 1 GB at 2,500
  # cells and 4 GB at 37,000 on 202,699-site panels, and up to 4 GB at 14,000 on
  # 6-million-site ones. Jobs take under 2 min; the memory request sets the charge.
  report_variant_embedding:
    threads: 1
    queue: normalsr
  present_absent_screen:
    # Observed peak ~2.5GB.
    threads: 1
    mem: "4GB"
    runtime: 30
    queue: normalsr
  report_distinctiveness:
    # Observed peak ~2.6GB.
    threads: 1
    mem: "4GB"
    runtime: 30
    queue: normalsr
  hierarchical_consensus:
    # Observed peak ~0.7GB.
    threads: 1
    mem: "2GB"
    runtime: 30
    queue: normalsr
