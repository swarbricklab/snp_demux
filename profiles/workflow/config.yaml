# Workflow profile

# General settings
verbose: False
keep-going: True
rerun-incomplete: True
latency-wait: 30
retries: 2

# Conda settings
use-conda: True
conda-frontend: mamba

# Resource settings per rule. Only rules that need more than the defaults are
# listed; everything else (bcftools helpers, R wrangling/reporting, summaries,
# aggregation, preflight) runs with Snakemake's defaults.
set-resources:
  demuxlet:
    mem: "16GB"
    runtime: 60
  demuxlet_summary:
    mem: "8GB"
    runtime: 5
  freemuxlet:
    threads: 2
    mem: "16GB"
    runtime: 60
  freemuxlet_summary:
    mem: "2GB"
    runtime: 5
  demuxafy:
    mem: "2GB"
    runtime: 60
  # souporcell resumes from sc_pileup's ref/alt.mtx: cluster is the heavy step;
  # troublet/consensus are light.
  souporcell_cluster:
    threads: 16
    mem: "64GB"
    runtime: 720
  souporcell_troublet:
    threads: 1
    mem: "8GB"
  souporcell_consensus:
    threads: 1
    mem: "8GB"
  vireo:
    threads: 16
    mem: "32GB"
  vireosnp:
    mem: "8GB"
    runtime: 10
