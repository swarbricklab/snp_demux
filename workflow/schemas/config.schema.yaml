$schema: "http://json-schema.org/draft-07/schema#"
description: >-
  snp_demux configuration. Validated at workflow start via
  snakemake.utils.validate() in rules/common.smk.
type: object
properties:
  deps:
    type: object
    description: Inputs the workflow depends on.
    properties:
      samples:
        type: string
        description: Path to samples.csv (sample_id, donor_id, capture_id).
      captures:
        type: string
        description: Path to captures.csv (capture_id + barcodes; optional platform column).
      pileup_root:
        type: string
        description: >-
          Root of the sc_pileup outputs consumed here, laid out as
          <pileup_root>/<engine>/<platform>/<capture_id>/<files>.
      panel_root:
        type: string
        description: >-
          Root of the per-pool informative donor-genotype panels
          (<panel_root>/<capture_id>/informative.vcf.gz). Defaults to
          <pileup_root>/panel.
      default_platform:
        type: string
        description: Platform segment used when a capture has no `platform` column. Defaults to "short".
      vcf:
        type: string
        description: Legacy cohort donor VCF; retained for reference, unused by the current rules.
    required: [samples, captures, pileup_root]
    additionalProperties: false
  outs:
    type: object
    properties:
      root: {type: string, description: Root for all data outputs.}
      logs: {type: string, description: Root for per-rule logs.}
      reports:
        type: string
        description: Where HTML reports are written. Defaults to <outs.root>/report.
    required: [root, logs]
    additionalProperties: false
  params:
    type: object
    properties:
      cellsnp_lite:
        type: object
        description: Legacy pileup thresholds; the pileup is produced upstream now, so these are unused here.
      demuxlet:
        type: object
        properties:
          coeff: {type: number}
          offset: {type: number}
        required: [coeff, offset]
      demuxafy:
        type: object
        properties:
          freemuxlet_correlation_limit: {type: number}
          souporcell_correlation_limit: {type: number}
          pct_agreement: {type: number}
        required: [freemuxlet_correlation_limit, souporcell_correlation_limit, pct_agreement]
      consensus:
        type: object
        description: >-
          Optional. How the per-method calls are combined (workflow/scripts/consensus.py).
        properties:
          method:
            type: string
            enum: [informative_majority, at_least_half_singlet]
            default: informative_majority
            description: >-
              informative_majority: majority of the methods that made a singlet/doublet
              call (unassigned abstains; a tie or too few calls -> unassigned).
              at_least_half_singlet: Demuxafy's AtLeastHalfSinglet (singlet if at least
              half the methods call singlet, else doublet).
          min_informative:
            type: integer
            minimum: 1
            default: 2
            description: informative_majority only. Fewer singlet/doublet calls than this -> unassigned.
          cluster_naming:
            type: string
            enum: [genotype, vireo_agreement]
            default: genotype
            description: >-
              How freemuxlet / souporcell clusters are given donor names.
              genotype: the donor whose known genotype is clearly closest to the
              cluster genotype (vireoSNP GPb_diff; see min_genotype_margin).
              vireo_agreement: the vireo donor shared by at least
              demuxafy.pct_agreement of the cluster's barcodes (Demuxafy's method).
          min_genotype_margin:
            type: number
            minimum: 0
            maximum: 1
            default: 0.1
            description: >-
              cluster_naming genotype only. A cluster is named after its closest donor
              when (second-best - best) / second-best GPb_diff is at least this.
          recover_from:
            type: array
            items:
              type: string
              enum: [demuxlet, freemuxlet, souporcell, vireo]
            uniqueItems: true
            default: [souporcell, vireo]
            description: >-
              informative_majority only. A barcode that exactly one method calls, as a
              singlet of a named donor, gets status "recovered" (with that donor) instead
              of "unassigned" when that method is listed here. [] turns this off.
              Recovered barcodes are reported separately from singlets.
        additionalProperties: false
      souporcell:
        type: object
        properties:
          restarts: {type: integer}
          min_ref: {type: integer}
          min_alt: {type: integer}
          ploidy: {type: integer}
        required: [restarts, min_ref, min_alt]
      doublet:
        type: object
        description: >-
          Optional. Expected-doublet-rate inputs for doublet_summary.csv.
          Defaults: rate_per_1k {standard: 0.008, HT: 0.004}, default_chip standard.
        properties:
          rate_per_1k:
            type: object
            description: Doublet rate per 1,000 cells loaded, keyed by chip (case-insensitive).
            additionalProperties: {type: number, minimum: 0}
          default_chip:
            type: string
            description: Chip used for captures with no `chip` column value.
        additionalProperties: false
    required: [demuxlet, demuxafy, souporcell]
  ref:
    type: object
    properties:
      souporcell:
        type: object
        properties:
          genome_fasta:
            type: string
            description: Reference genome FASTA, matching the cellranger transcriptome.
        required: [genome_fasta]
    required: [souporcell]
  containers:
    type: object
    description: Per-tool container images (replaces the old monolithic Demuxafy.sif).
    properties:
      bcftools: {type: string}
      popscle: {type: string}
      vireo: {type: string}
      vireosnp: {type: string}
      souporcell: {type: string}
      r: {type: string}
      demuxafy: {type: string}
    required: [bcftools, popscle, vireo, vireosnp, souporcell, r, demuxafy]
    additionalProperties: false
required: [deps, outs, params, ref, containers]
