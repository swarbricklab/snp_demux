name:
    embedding
channels:
    - conda-forge
    - bioconda
dependencies:
    # numpy pinned <2 so the numba/llvmlite stack umap-learn pulls stays ABI-
    # compatible with pandas (an unpinned solve grabbed numpy 2.x and broke
    # pandas._libs). pandas listed explicitly since report_variant_embedding.py
    # uses it (it was only transitively present before).
    - python=3.10
    - numpy<2
    - pandas>=1.5,<2.1
    - scipy
    - scikit-learn
    - umap-learn
    - matplotlib
